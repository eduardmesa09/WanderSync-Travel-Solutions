server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeceras de seguridad. Solo se cargan recursos propios y las fuentes de
    # Google; 'unsafe-inline' en estilos lo exigen los atributos style de React.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API GraphQL: se reenvía al gateway por la red interna de Docker.
    location = /graphql {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # bookPackage responde cuando termina el SAGA
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
